name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build Debug and Release
        run: |
          mkdir -p Temp/Logs
          xcodebuild -version
          for configuration in Debug Release; do
            coverage_setting=YES
            if [[ "$configuration" == Release ]]; then coverage_setting=NO; fi
            xcodebuild -project NanoMD.xcodeproj -scheme NanoMD \
              -configuration "$configuration" -destination 'platform=macOS,arch=arm64' \
              -derivedDataPath "$PWD/Temp/DerivedData" \
              -clonedSourcePackagesDirPath "$PWD/Temp/SourcePackages" \
              -packageCachePath "$PWD/Temp/PackageCache" \
              -onlyUsePackageVersionsFromResolvedFile \
              ENABLE_CODE_COVERAGE="$coverage_setting" \
              ARCHS=arm64 CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= build \
              2>&1 | tee "Temp/Logs/$configuration.log"
          done
          xcrun size -m Temp/DerivedData/Build/Products/Release/NanoMD.app/Contents/MacOS/NanoMD > Temp/Logs/Release-sections.txt
          if /usr/bin/grep -Eq '__LLVM_COV|__llvm_prf_' Temp/Logs/Release-sections.txt; then
            echo 'Release app contains code-coverage instrumentation.' >&2
            exit 1
          fi
      - name: Run regression tests
        run: |
          xcodebuild -project NanoMD.xcodeproj -scheme NanoMD \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$PWD/Temp/DerivedData" \
            -clonedSourcePackagesDirPath "$PWD/Temp/SourcePackages" \
            -packageCachePath "$PWD/Temp/PackageCache" \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath "$PWD/Temp/TestResults/RegressionTests.xcresult" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= test \
            2>&1 | tee Temp/Logs/Tests.log
      - name: Retain build and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-and-test-results
          path: |
            Temp/Logs/*
            Temp/TestResults/*.xcresult
          retention-days: 7
          if-no-files-found: ignore
