name: Deploy website

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo 'Missing CLOUDFLARE_API_TOKEN repository secret. See CONTRIBUTING.md#website.' >&2
            exit 1
          fi
      - name: Install pinned deployment tool
        run: npm --prefix website ci --cache ./Temp/npm-cache --logs-dir ./Temp/npm-logs
      - name: Synchronize published release and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm --prefix website run deploy
